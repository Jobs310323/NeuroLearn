# Проверки, которые обязаны проходить до слияния.
#
# Три шага повторяют то, что запускается вручную перед коммитом
# (`README.md`, раздел «Команды»): типы, линтер, тесты. Ничего сверх этого
# в CI нет намеренно — см. комментарии ниже.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: очередь бесплатных
# раннеров общая, а результат устаревшего коммита никому не нужен.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Тесты офлайн: `db` в них замокан (`vi.mock('@/lib/db')`). Но
      # `src/lib/db/index.ts` требует `DATABASE_URL` уже на импорте — иначе
      # падает любой модуль, который его импортирует, даже если запрос не
      # делается. Значение заведомо нерабочее: если какой-то тест всё же
      # полезет в сеть, это станет видно как ошибка соединения, а не как
      # молчаливое обращение к настоящей базе.
      DATABASE_URL: postgresql://USER:PASSWORD@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` вместо `npm install`: ставит ровно то, что в package-lock.json.
      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      # `npm run build` здесь не запускается: его `prebuild` — это
      # `scripts/check-env.ts`, которому нужны настоящие ключи провайдеров и
      # строка подключения. Класть их в секреты репозитория ради проверки
      # сборки — плохой размен: сборку всё равно делает Vercel на каждый пуш,
      # и её падение видно там же.
